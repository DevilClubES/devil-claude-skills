name: CATTLE repository on-demand
run-name: 'Cattle consumer ${{ inputs.profile }} subject ${{ inputs.target_sha }} slot ${{ inputs.slot }}'

on:
  push:
    branches: [codex/cattle-on-demand]
    paths: [.github/workflows/cattle-on-demand.yml]
  workflow_dispatch:
    inputs:
      target_sha:
        description: Immutable subject commit in this repository
        required: true
        type: string
      base_sha:
        description: Immutable baseline commit; never resolved again during the job
        required: true
        type: string
      profile:
        description: Audited bank or infrastructure canary
        required: true
        type: choice
        options: [canary, ci, okf, copy-review, design-tokens, env-secrets, error-leak, fetch-timeout, i18n-email, limit-orden, tests-diff, tsc-diff]
      slot:
        description: Disposable physical slot; only one active in the shared family
        required: true
        type: choice
        options: ['01', '02', '03']

permissions:
  contents: read

concurrency:
  group: cattle-consumer-${{ github.repository }}-${{ inputs.slot }}
  cancel-in-progress: false

jobs:
  gate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [cattle, kvm, dos-cattle-r18, 'dos-cattle-repo-${{ github.event.repository.name }}', 'dos-cattle-slot-${{ inputs.slot }}']
    timeout-minutes: 30
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
      BASE_SHA: ${{ inputs.base_sha }}
      HEAD_SHA: ${{ inputs.target_sha }}
      TEST_PROFILE: ${{ inputs.profile }}
      WORKFLOW_SOURCE_SHA: ${{ github.workflow_sha }}
    steps:
      - name: Preventive admission before fetching candidate code
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          allowed = json.loads(r'''
          {
            "DevilClubES/devil-club": [
              "canary",
              "copy-review",
              "design-tokens",
              "env-secrets",
              "error-leak",
              "fetch-timeout",
              "i18n-email",
              "limit-orden",
              "tests-diff",
              "tsc-diff"
            ],
            "DevilClubES/yvypy": [
              "canary",
              "ci",
              "okf"
            ],
            "DevilClubES/ojopy": [
              "canary",
              "okf"
            ],
            "DevilClubES/kaggriculture-r4-lab": [
              "canary"
            ],
            "DevilClubES/devil-sol-bridge": [
              "canary"
            ],
            "DevilClubES/testing": [
              "canary"
            ],
            "DevilClubES/codex-suggestion-inbox": [
              "canary"
            ],
            "DevilClubES/devil-claude-skills": [
              "canary"
            ],
            "DevilClubES/roast-arena": [
              "canary"
            ],
            "DevilClubES/brandforge": [
              "canary"
            ],
            "DevilClubES/puntos-justos": [
              "canary"
            ],
            "DevilClubES/favor-farm": [
              "canary"
            ],
            "DevilClubES/inv-devil-club": [
              "canary"
            ],
            "DevilClubES/devil-club-tiktok-automation": [
              "canary"
            ],
            "DevilClubES/tradelab": [
              "canary"
            ]
          }
          ''')
          assert os.environ['GITHUB_REPOSITORY'] in allowed, 'repository not admitted'
          assert os.environ['TEST_PROFILE'] in allowed[os.environ['GITHUB_REPOSITORY']], 'bank not admitted for repository'
          assert all(re.fullmatch('[0-9a-f]{40}', os.environ[key]) for key in ['TARGET_SHA', 'BASE_SHA'])
          for key in ['GH_READ_TOKEN', 'OPENROUTER_API_KEY', 'DATABASE_URL', 'DOS_CI_ATTESTATION_KEY']:
              assert not os.environ.get(key), 'candidate authority must be absent'
          PY
          /usr/local/bin/cattle-isolation
          test "$(systemd-detect-virt)" = kvm
          test "$(node --version)" = v20.20.0
          test "$(/usr/bin/node --version)" = v22.23.3
          test "$(git --version)" = 'git version 2.55.0'
          test -z "$(pg_lsclusters --no-header)"
          fixture_cluster=$(mktemp -d "$RUNNER_TEMP/cattle-consumer-pg-XXXXXX")
          /usr/lib/postgresql/17/bin/initdb -D "$fixture_cluster" --no-locale --encoding=UTF8 --auth-local=trust --auth-host=reject >/dev/null
          case "$fixture_cluster" in "$RUNNER_TEMP"/cattle-consumer-pg-*) rm -rf -- "$fixture_cluster" ;; *) exit 1 ;; esac
          echo CATTLE_CONSUMER_ADMISSION_PASS

      - name: Fetch exact subject and baseline with own-repository read-only authority
        id: fetch
        shell: bash
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir source
          git -C source init
          git -C source remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_READ_TOKEN" | base64 -w0)"
          git -C source fetch --no-tags origin "$TARGET_SHA" "$BASE_SHA"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0 GH_READ_TOKEN
          git -C source checkout --detach "$TARGET_SHA"
          test "$(git -C source rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C source rev-parse "$BASE_SHA^{commit}")" = "$BASE_SHA"
          echo "EXECUTED_SUBJECT_SHA=$(git -C source rev-parse HEAD)"
          echo "EXECUTED_SUBJECT_TREE=$(git -C source rev-parse HEAD^{tree})"
          echo "EXECUTED_BASE_SHA=$BASE_SHA"

      - name: Run the admitted bank with no production credentials
        id: bank
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/cattle-consumer-canary.test.cjs" <<'JS'
          const assert = require('node:assert/strict');
          const { test } = require('node:test');
          const { execFileSync } = require('node:child_process');
          test('pinned toolchain serves the disposable guest', () => {
            assert.equal(process.version, 'v20.20.0');
            assert.equal(execFileSync('/usr/bin/node', ['--version'], {encoding:'utf8'}).trim(), 'v22.23.3');
            assert.equal(execFileSync('git', ['--version'], {encoding:'utf8'}).trim(), 'git version 2.55.0');
          });
          test('candidate runs unprivileged without inherited fetch or product authority', () => {
            assert.notEqual(process.getuid(), 0);
            for (const key of ['GH_READ_TOKEN','GIT_CONFIG_VALUE_0','OPENROUTER_API_KEY','DATABASE_URL','DOS_CI_ATTESTATION_KEY']) assert.ok(!process.env[key], key);
          });
          test('subject is immutable and no HTTP authorization persisted in Git config', () => {
            assert.equal(execFileSync('git', ['rev-parse','HEAD'], {encoding:'utf8'}).trim(), process.env.TARGET_SHA);
            assert.equal(execFileSync('git', ['config','--local','--list'], {encoding:'utf8'}).includes('extraheader='), false);
          });
          process.on('exit', code => { if (code === 0) console.log('CATTLE_CONSUMER_CANARY_PASS'); });
          JS
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys, time
          profiles = json.loads(r'''
          {
            "DevilClubES/devil-club": {
              "canary": {
                "authority": "INFRASTRUCTURE_ONLY",
                "required_paths": [],
