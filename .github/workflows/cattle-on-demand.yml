                  "node --version",
                  "node --test \"$RUNNER_TEMP/cattle-consumer-canary.test.cjs\""
                ],
                "environment": {},
                "product_tests": "NOT_RUN"
              },
              "copy-review": {
                "authority": "TEST_EVIDENCE_ONLY",
                "required_paths": [
                  "scripts/copy-review-lint.mjs"
                ],
                "commands": [
                  "node scripts/copy-review-lint.mjs --diff \"$BASE_SHA\" \"$HEAD_SHA\""
                ],
