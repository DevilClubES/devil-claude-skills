          ''')
          repo, profile = os.environ['GITHUB_REPOSITORY'], os.environ['TEST_PROFILE']
          spec = profiles[repo][profile]
          for key in ['GH_READ_TOKEN', 'GIT_CONFIG_VALUE_0', 'OPENROUTER_API_KEY', 'DATABASE_URL', 'DOS_CI_ATTESTATION_KEY']:
              assert not os.environ.get(key), 'credential boundary not cleared'
          env = dict(os.environ, **spec['environment'])
          env.update(GIT_TERMINAL_PROMPT='0', GIT_CONFIG_GLOBAL='/dev/null', GIT_CONFIG_NOSYSTEM='1')
          log = pathlib.Path(os.environ['RUNNER_TEMP']) / 'cattle-consumer-bank.log'
          receipt = pathlib.Path(os.environ['RUNNER_TEMP']) / 'cattle-consumer-receipt.json'
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          result = {'schema':'dos.cattle.consumer-result.v1', 'repository':repo, 'profile':profile,
                    'authority':spec['authority'], 'product_tests':spec['product_tests'],
                    'source_sha':os.environ['WORKFLOW_SOURCE_SHA'], 'subject_sha':git('rev-parse','HEAD'),
                    'subject_tree':git('rev-parse','HEAD^{tree}'), 'base_sha':os.environ['BASE_SHA'],
                    'base_tree':git('rev-parse',os.environ['BASE_SHA']+'^{tree}'),
                    'runner_name':os.environ['RUNNER_NAME'], 'run_id':os.environ['GITHUB_RUN_ID'],
                    'native_admission':'NOT_ATTESTED', 'merge_deploy_publication':'NOT_RUN', 'commands':[]}
          failure = 0
          started = time.monotonic()
          result['commands'] = [{'command_sha256':hashlib.sha256(command.encode()).hexdigest(), 'state':'NOT_RUN'} for command in spec['commands']]
          missing = [pattern for pattern in spec['required_paths'] if not list(pathlib.Path('.').glob(pattern))]
          with log.open('w') as output:
              if missing:
                  failure = 1
                  result['missing_inputs'] = missing
                  output.write('BANK_ADMISSION_REJECTED: missing immutable inputs\n')
                  print('BANK_ADMISSION_REJECTED: missing immutable inputs')
              else:
                  # The recipe retains intentional exports such as TSC_BIN.
                  # Candidate stdout is diagnostic data, never per-command proof.
                  script = '\n'.join(spec['commands'])
                  result['recipe_sha256'] = hashlib.sha256(script.encode()).hexdigest()
                  proc = subprocess.Popen(['bash','-euo','pipefail','-c',script], env=env,
                                          stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
                  for line in proc.stdout:
                      output.write(line); output.flush(); sys.stdout.write(line); sys.stdout.flush()
                  failure = proc.wait()
                  result['recipe_exit_code'] = failure
                  for entry in result['commands']:
                      entry['state'] = 'NOT_ATTESTED_INDIVIDUALLY'
          result.update(state='FAIL' if failure else 'PASS', duration_seconds=round(time.monotonic()-started,3),
                        log_sha256=hashlib.sha256(log.read_bytes()).hexdigest())
          if profile != 'canary': result['product_tests'] = 'BANK_FAIL' if failure else 'BANK_PASS'
          receipt.write_text(json.dumps(result,indent=2)+'\n')
          print('CATTLE_CONSUMER_RESULT=' + result['state'])
          sys.exit(1 if failure else 0)
          PY

      - name: Preserve consumer receipt before ephemeral shutdown
        if: ${{ !cancelled() && steps.fetch.conclusion == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cattle-consumer-${{ github.event.repository.name }}-${{ inputs.profile }}-${{ inputs.target_sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/cattle-consumer-receipt.json
            ${{ runner.temp }}/cattle-consumer-bank.log
