name: Validate skills

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lint canonical skills
        run: node scripts/lint-skills.mjs
      - name: Verify generated Codex adapter
        run: node scripts/sync-codex-package.mjs --check
      - name: Test deterministic checks
        run: node scripts/test-tooling.mjs
      - name: Reject uncommitted generated drift
        run: git diff --exit-code -- plugins/design-skills-codex
